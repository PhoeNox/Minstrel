name: "Deploy Mobile to GitHub Pages"
on:
  push:
    branches: [ main ]
    paths: [ 'Mobile/**', '.github/workflows/deploy-mobile.yml' ]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Mobile/package-lock.json

      - name: Build static PWA
        working-directory: Mobile
        # BASE_PATH is the Pages project subpath: https://<owner>.github.io/<repo>/
        env:
          BASE_PATH: ${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
          cp build/index.html build/404.html   # SPA deep-link fallback on Pages
          touch build/.nojekyll                 # keep Pages from hiding the _app/ dir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Mobile/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
