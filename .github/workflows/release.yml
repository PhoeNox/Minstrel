name: Release
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.kind }}-${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - kind: linux
            arch: x64
            os: ubuntu-latest
            rid: linux-x64
          - kind: linux
            arch: arm64
            os: ubuntu-latest
            rid: linux-arm64
          - kind: macos
            arch: x64
            os: macos-latest
            rid: osx-x64
          - kind: macos
            arch: arm64
            os: macos-latest
            rid: osx-arm64
          - kind: windows
            arch: x64
            os: windows-latest
            rid: win-x64
          - kind: windows
            arch: arm64
            os: windows-latest
            rid: win-arm64
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Publish
        run: just publish ${{ matrix.rid }} publish/Minstrel

      - name: Archive artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd publish
          zip -r ../minstrel-${{ matrix.kind }}-${{ matrix.arch }}.zip Minstrel

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/Minstrel -DestinationPath minstrel-${{ matrix.kind }}-${{ matrix.arch }}.zip

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: minstrel-${{ matrix.kind }}-${{ matrix.arch }}.zip
